name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/JarvisFire.Desktop/JarvisFire.Desktop.csproj
      - name: Build
        run: dotnet build src/JarvisFire.Desktop/JarvisFire.Desktop.csproj -c Release --no-restore
      - name: Restore API
        run: dotnet restore src/JarvisFire.Api/JarvisFire.Api.csproj
      - name: Build API
        run: dotnet build src/JarvisFire.Api/JarvisFire.Api.csproj -c Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish src/JarvisFire.Desktop/JarvisFire.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: JarvisFire-Windows-prototype
          path: publish/